name: Docker Image CI

on:
  push:
    branches: [ "1.8" ]
  pull_request:
    branches: [ "1.8" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clean up Docker to free space
      run: docker system prune -a --volumes -f
    - name: Build the Docker image
      run: docker build . --file ./sentinel-dashboard/Dockerfile --tag pengliuah/sentinel:v1.8.8
    - name: Save the Docker image
      run: docker save pengliuah/sentinel:v1.8.8 -o "pengliuah/sentinel:v1.8.8-amd64.tar"
      
    - name: Compress the TAR files
      run: tar -czf x86-64-images.tar.gz *-amd64.tar

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-images-tar
        path: x86-64-images.tar.gz
        retention-days: 1  # 将保留天数设置为 1 天 最多可设置90天

    - name: Clean up intermediate files
      run: |
        rm *-amd64.tar
