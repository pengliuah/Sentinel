name: Docker Image CI

on:
  push:
    branches: [ "1.8" ]
  pull_request:
    branches: [ "1.8" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file ./sentinel-dashboard/Dockerfile --tag pengliuah/sentinel:$(date +%s)
